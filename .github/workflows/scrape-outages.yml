# Scheduled, and runnable by hand: Actions -> "Scrape outages" -> Run workflow.
#
# Visits each distributor's own outage page in a real browser, because most of
# these lists only exist after JavaScript runs and a Worker fetch sees an empty
# shell. Commits what it finds to data/outages.json, which the Worker serves.
#
# Scheduled twice a day (7am and 3pm AEST) for NSW, VIC and SA only, and
# runnable by hand for any state. It used to run four times a day across
# all eight and was the bulk of the Actions bill -- measured at about nine
# minutes a run, not the five this comment used to claim.
#
# It is no longer what keeps outages current. capture-outages.yml does that,
# every half hour, by running the Worker's own feed code on a runner; this
# job adds only what a browser alone can read, and merges its result with a
# fresh feed capture before committing. See capture-outages.yml for the
# shared minutes budget.
name: Scrape outages

on:
  schedule:
    # 7am and 3pm AEST. Was four a day across every state; it is now only
    # needed where a browser still adds something -- see the Scrape step.
    - cron: '0 21,5 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'States to scrape, comma separated (blank = all)'
        required: false
        default: ''
      probe:
        description: 'Also run the discovery probes (slow: catalogues, portals, third-party trackers)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Shared with capture-outages.yml: both write data/outages.json.
concurrency:
  group: outage-snapshot
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      # Scheduled runs read only NSW, VIC and SA. Measured operator by
      # operator on 16 October, those are the only states where a browser
      # still adds anything the feed capture does not: AusNet's list (VIC),
      # and the published totals of operators that block their lists
      # (Essential Energy in NSW, Jemena in VIC, SA Power Networks). Every
      # other state is read in full by capture-outages.yml, and the browser
      # got nothing there anyway -- blocked pages, or a map with no list.
      # A manual run still takes whatever states are asked for, all by
      # default.
      - name: Scrape
        run: |
          ONLY="${{ inputs.only }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then ONLY="nsw,vic,sa"; fi
          node scripts/scrape-outages.mjs --only "$ONLY" ${{ inputs.probe && '--probe' || '' }}

      # The browser cannot read the five operators that publish proper data
      # feeds -- their pages are blocked or are a map with no list -- which
      # left QLD, WA and ACT empty in the snapshot. The Worker's own feed
      # code reads them fine, so it runs here too and the two are merged:
      # the feed supplies rows, the browser supplies published totals for
      # operators that block their lists, and fills any gap the feed has in
      # this same run. See scripts/lib/merge-outage-snapshot.mjs.
      - name: Merge in the Worker's feed capture
        if: always()
        run: node scripts/capture-outages.mjs --with-browser

      # Saved whether or not the run succeeded: a page the scraper could not
      # read is the thing most worth looking at, and the rendered HTML plus a
      # screenshot are what turn that into a fix.
      - name: Upload artifacts for anything unparsed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unparsed-pages
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      # `always()` because a run that overshoots the timeout is exactly the
      # one whose partial results are worth keeping -- the scraper writes its
      # diagnostics after each phase for the same reason.
      - name: Commit the snapshot
        if: always()
        run: |
          # Survives a push race. This step used to end in a bare `git push`,
          # and run 32 fetched every operator, wrote the snapshot, uploaded
          # its artifacts, committed -- and discarded all of it when the push
          # was rejected as a non-fast-forward.
          BRANCH="${{ github.ref_name }}" \
            scripts/commit-data.sh "Update outage snapshot" data/
