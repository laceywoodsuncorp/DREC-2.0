# Manually triggered: Actions -> "Scrape outages" -> Run workflow.
#
# Visits each distributor's own outage page in a real browser, because most of
# these lists only exist after JavaScript runs and a Worker fetch sees an empty
# shell. Commits what it finds to data/outages.json, which the Worker serves.
#
# Scheduled four times a day inside working hours, and runnable by hand at
# any time.
#
# THE BUDGET THIS IS SIZED AGAINST IS ACTIONS MINUTES, NOT ANYTHING ELSE.
# This workflow runs a Node script in a browser; it calls no model and costs
# no model tokens. A run takes about five minutes, and a private repo gets
# 2,000 free Actions minutes a month:
#
#     hourly      720 runs   3,600 min   180% of the budget -- impossible
#     every 6h    120 runs     600 min    30%
#     daily        30 runs     150 min     7.5%
#
# Four a day is the "about a third" setting.
#
# TIMES ARE UTC, which GitHub requires, and the window asked for was 6am to
# 8pm in Australian Eastern Standard Time (UTC+10):
#
#     20:00 UTC -> 06:00 AEST   (the next day)
#     01:00 UTC -> 11:00 AEST
#     06:00 UTC -> 16:00 AEST
#     10:00 UTC -> 20:00 AEST
#
# AEST is Brisbane, which does not observe daylight saving. A reader in
# Sydney or Melbourne will see these an hour later over summer -- 7am to 9pm
# rather than 6am to 8pm. Worth knowing before anyone reads the first run of
# the day as late.
#
# The Worker's own five-minute cron is NOT affected by this and should not
# be. It is what keeps the dashboard current, it costs nothing, and outages
# do not stop overnight -- a storm at 2am is exactly when someone would want
# this page to be right.
name: Scrape outages

on:
  schedule:
    - cron: '0 20,1,6,10 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'States to scrape, comma separated (blank = all)'
        required: false
        default: ''
      probe:
        description: 'Also run the discovery probes (slow: catalogues, portals, third-party trackers)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Scrape
        run: node scripts/scrape-outages.mjs --only "${{ inputs.only }}" ${{ inputs.probe && '--probe' || '' }}

      # Saved whether or not the run succeeded: a page the scraper could not
      # read is the thing most worth looking at, and the rendered HTML plus a
      # screenshot are what turn that into a fix.
      - name: Upload artifacts for anything unparsed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unparsed-pages
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      # `always()` because a run that overshoots the timeout is exactly the
      # one whose partial results are worth keeping -- the scraper writes its
      # diagnostics after each phase for the same reason.
      - name: Commit the snapshot
        if: always()
        run: |
          # Survives a push race. This step used to end in a bare `git push`,
          # and run 32 fetched every operator, wrote the snapshot, uploaded
          # its artifacts, committed -- and discarded all of it when the push
          # was rejected as a non-fast-forward.
          BRANCH="${{ github.ref_name }}" \
            scripts/commit-data.sh "Update outage snapshot" data/
