# Builds the suburb/locality gazetteer the outage map plots town names with.
# Run it when the ABS publishes a new ASGS edition; the data does not change
# otherwise, so there is no schedule.
name: Build gazetteer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: node scripts/build-gazetteer.mjs
      - name: Commit
        if: always()
        run: |
          BRANCH="${{ github.ref_name }}" \
            scripts/commit-data.sh "Rebuild the locality gazetteer" data/
