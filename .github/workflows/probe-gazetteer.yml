# A one-off lookup, kept separate from the outage capture so it costs seconds
# rather than riding along with a half-hour browser run.
name: Probe gazetteer sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe
        run: node scripts/probe-gazetteer.mjs
      - name: Commit the findings
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          BRANCH="${{ github.ref_name }}" \
            scripts/commit-data.sh "Record gazetteer source probe" data/
