# Runs one probe on demand and keeps its findings.
#
# Diagnose runs every probe and takes ten minutes or more; a new question
# usually needs one. The probe is chosen from a fixed list -- a choice
# input, so nothing typed into the form reaches a shell.
name: Probe

on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Which probe to run'
        required: true
        type: choice
        options:
          - bom-rivers
          - bom-stations
          - gauge-coords
          - gauge-sources

permissions:
  contents: write

concurrency:
  group: probe-${{ inputs.probe }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # What BOM publishes for machines about river heights and flooding,
      # and its terms for using it.
      - name: BOM river heights and flood products
        if: ${{ inputs.probe == 'bom-rivers' }}
        run: node scripts/probe-bom-rivers.mjs

      # Where BOM publishes its river gauges' locations, for a map.
      - name: BOM river gauge locations
        if: ${{ inputs.probe == 'bom-stations' }}
        run: node scripts/probe-bom-stations.mjs

      # How many river gauges each BOM location source places, and whether
      # the two agree where both do.
      - name: River gauge coordinates, by source
        if: ${{ inputs.probe == 'gauge-coords' }}
        run: node scripts/probe-gauge-coords.mjs

      # Which published source knows where the gauges the map cannot place
      # are, measured by station number.
      - name: Sources for the unplaced river gauges
        if: ${{ inputs.probe == 'gauge-sources' }}
        run: node scripts/probe-gauge-sources.mjs

      - name: Keep the findings
        if: always()
        run: |
          set -e
          files=$(ls data/bom-terms.txt data/bom-fwo-list.txt data/bom-river-probe.json data/bom-product-titles.tsv data/bom-stations-probe.json data/gauge-coords-probe.json data/gauge-sources-probe.json data/bom-samples/*.txt 2>/dev/null || true)
          [ -n "$files" ] || { echo "nothing to keep"; exit 0; }
          BRANCH="${{ github.ref_name }}" scripts/commit-data.sh "Record probe findings" $files
