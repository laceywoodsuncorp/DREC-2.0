# Captures every state's outage list by running the Worker's own outage code
# on a runner, and commits it to data/outages.json, which the Worker serves.
#
# Exists because Cloudflare's free plan allows the Worker 10ms of CPU per
# invocation and outage parsing measured at ~300ms for NSW alone -- the
# Worker was being stopped mid-task 100+ times a day. Here CPU is not the
# constraint. See scripts/capture-outages.mjs.
#
# No browser, so it is quick: measured at 22 seconds end to end, which
# GitHub bills as one minute. The browser scrape (scrape-outages.yml) takes
# about nine and is now only needed for AusNet's list and for the published
# totals of the operators that block theirs. This keeps the rows current.
#
# THE BUDGET is 2,000 free Actions minutes a month, SHARED across every
# private repository on the account -- this repo's own usage is all that
# was measured, so leave room for the others.
#
#   this capture     35 runs/day x 1 min            ~1,050 min/month
#   browser scrape    2 runs/day x ~6 min (3 states)  ~360
#   CI and checks    on pushes and by hand            ~200
#                                                   ------
#                                                   ~1,610  (about 80%)
#
# Every capture commits data/outages.json, and Cloudflare rebuilds on every
# push to the branch -- that is how the snapshot reaches the Worker. Its
# free plan allows 3,000 build minutes a month with one build at a time.
#
# Times are UTC. AEST is UTC+10 (Brisbane, no daylight saving; Sydney and
# Melbourne read an hour later over summer):
#
#   every 30 min, 20:00-10:59 UTC  ->  6:00am-8:30pm AEST   30 runs
#   11,13,15,17,19 UTC             ->  9pm, 11pm, 1am, 3am, 5am  5 runs
#
# Overnight is thinner, not absent: a storm at 2am is exactly when someone
# would want this page to be right, and the Worker no longer fetches
# outages itself to cover the gap.
#
# GitHub starts scheduled runs late under load, often by 5-15 minutes, so
# "every 30 minutes" means a capture is usually under 45 minutes old.
name: Capture outages

on:
  schedule:
    - cron: '*/30 20-23,0-10 * * *'
    - cron: '0 11,13,15,17,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Shared with scrape-outages.yml: both write data/outages.json, so they run
# one at a time rather than racing. Queued, never cancelled -- a cancelled
# capture is a gap in the data.
concurrency:
  group: outage-snapshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture every state through the Worker's own code
        run: node scripts/capture-outages.mjs
      - name: Commit the snapshot
        run: |
          BRANCH="${{ github.ref_name }}" \
            scripts/commit-data.sh "Capture outage snapshot" data/outages.json
