# Asks the live service and the agencies what they actually return.
#
# Read-only, no credential, deploys nothing. Exists because the sandbox this
# project is developed in cannot reach workers.dev or most agency hosts -- the
# egress proxy answers 403 -- so every question about live behaviour was being
# answered by reading the source, which only says what the code would do with
# a well-formed response. This says what is really being sent.
name: Diagnose

on:
  workflow_dispatch:
    inputs:
      nt_probe:
        description: 'Also search the catalogues for an NT outage feed'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Which states carry an agency alert level, and which only carry a
      # status. That is the whole difference between NSW's display and the
      # others, and it is a property of the feeds, not of the page.
      - name: Live incidents and outages, per state
        run: node scripts/diagnose-states.mjs

      - name: Same thing as JSON, kept with the run
        run: |
          mkdir -p data
          node scripts/diagnose-states.mjs --json > data/state-health.json || true

      - name: Search the catalogues for an NT outage feed
        if: ${{ inputs.nt_probe }}
        run: node scripts/probe-nt-power.mjs

      # Which agencies publish a public alert level, and where. This is the
      # difference between NSW's display and everyone else's, and it is a
      # property of the feeds rather than of the page.
      - name: Find each state's warnings feed
        run: node scripts/probe-warnings.mjs

      # Which outage locations the map cannot place, and why. Run before the
      # probes below so it is in the log even if a probe times out.
      - name: Unmapped towns
        run: node scripts/unmapped-towns.mjs

      # The routes still open for SA and NT outages, both of which report
      # nothing today.
      - name: SA and NT outage routes
        run: node scripts/probe-sa-nt-outages.mjs

      # The field names of the feeds the step above found. Parsers get written
      # against this output, not against a guess at what a column is called.
      - name: Dump the shape of the usable warnings feeds
        run: node scripts/probe-shapes.mjs

      # Committed because a probe whose findings are not written down gets run
      # again from scratch next time the question comes up -- which has
      # happened on this project more than once.
      - name: Keep the findings
        if: always()
        run: |
          set -e
          # The retry loop that used to be here retried the push alone, which
          # cannot fix a non-fast-forward: it is still one five seconds later.
          # commit-data.sh rebases onto the remote between attempts.
          BRANCH="${{ github.ref_name }}" \
            scripts/commit-data.sh 'Record live state health and the feed probes' \
              data/state-health.json data/nt-power-probe.json \
              data/warnings-probe.json data/shape-probe.json data/sa-nt-probe.json data/unmapped-towns.json
